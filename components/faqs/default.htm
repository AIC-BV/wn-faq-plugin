{% set faqsPerCategory = __SELF__.faqsPerCategory %}
{% set componentId = __SELF__.id %}
{% if __SELF__.canShowSearch %}
    <aside class='aic-search'>
        <form data-request="onSearch" data-request-data="componentId: '{{ componentId }}'" data-request-loading>
            <label for="search-{{ componentId }}" class="sr-only">
                {{ 'aic.faq::lang.components.faqs.search_placeholder' | trans }}
            </label>
            <input type="text" id="search-{{ componentId }}" name="q"
                placeholder="{{ 'aic.faq::lang.components.faqs.search_placeholder' | trans }}"
                value="{{ __SELF__.searchQuery }}"
                data-track-input="500"
            >
            <button type="submit">{{ 'aic.faq::lang.components.faqs.search_button' | trans }}</button>
        </form>
    </aside>
{% endif %}

<div class="aic-faqs" id="{{ componentId }}">
    {% partial '@items' faqsPerCategory=faqsPerCategory %}
</div>


{% if faqsPerCategory | length > 0 %}
    {% put scripts %}
    <script type="application/ld+json">{{ __SELF__.jsonLd | raw }}</script>
    {% endput %}
{% endif %}

{% put styles %}
<style>
    form[data-request="onSearch"][data-request-data="componentId: '{{ componentId }}'"] {
        display: flex;
        align-items: center;
        position: relative;

        input[type="text"] {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border: 1px solid #ccc;
            border-right: none;
            border-radius: 4px 0 0 4px;
            outline: none;

            &:focus {
                border-color: #888;
            }
        }

        button {
            padding: 0.5rem 1rem;
            border: 1px solid #ccc;
            border-left: none;
            border-radius: 0 4px 4px 0;
            background: #f5f5f5;
            cursor: pointer;

            &:hover {
                background: #e8e8e8;
            }
        }
    }
    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0); /* Fallback for older browsers */
        clip-path: inset(50%);  /* modern version; overrides the fallback if supported */
        white-space: nowrap;
        border: 0;
    }
</style>
{% endput %}
