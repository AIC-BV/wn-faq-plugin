# ===================================
#  Field Definitions
# ===================================

fields:

    name:
        label: aic.faq::lang.models.category.label
        span: auto

    slug:
        label: aic.faq::lang.models.general.slug
        preset: name
        span: auto

    is_published:
        label: aic.faq::lang.models.general.published_status
        type: balloon-selector
        options: getPublishStatusOptions
        default: 1

secondaryTabs:
    fields:

        created_at:
            label: aic.faq::lang.models.general.created_at
            type: datepicker
            mode: date
            format: d/m/Y
            span: full
            disabled: true

        updated_at:
            label: aic.faq::lang.models.general.updated_at
            type: datepicker
            mode: date
            format: Y/m/d
            span: full
            disabled: true